<body>
<header><div class="wrap"><h1>Chilled Cucumber–Avocado Soup</h1></div></header>
<main class="wrap">
  <a class="back" href="index.html">← All recipes</a>
  <div class="card">
    <div class="meta">Time: 10 min • Serves: 2</div>
    <h2>Ingredients</h2>
    <ul>
      <li>1 cucumber, peeled</li>
<li>1 avocado</li>
<li>½ cup plain yoghurt</li>
<li>1 tbsp lemon juice</li>
<li>2–3 parsley leaves</li>
<li>Pinch of salt</li>
    </ul>
    <h2>Instructions</h2>
    <ul>
      <li>Blend until smooth; serve cold.</li>
    </ul>
  </div>
</main>
